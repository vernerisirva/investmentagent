name: Daily public watchlist

on:
  schedule:
    # Poll from the early Nordic morning because GitHub scheduled runs can drift.
    - cron: "7,17,27,37,47,57 0-7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-public-watchlist
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 390
    env:
      REPORT_ROOT: docs/reports
      EVALUATION_ROOT: data/evaluations
      OUTCOME_ROOT: data/evaluation-outcomes
      ANALYSIS_ROOT: data/evaluation-analysis
      RUN_DAILY_REPORT: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Decide scheduled run
        if: github.event_name == 'schedule'
        run: |
          helsinki_hour="$(TZ=Europe/Helsinki date +%H)"
          helsinki_minute="$(TZ=Europe/Helsinki date +%M)"
          report_date="$(TZ=Europe/Helsinki date +%F)"

          if [ "$helsinki_hour" -lt 8 ]; then
            wait_seconds=$(( (8 - 10#$helsinki_hour) * 3600 - 10#$helsinki_minute * 60 ))
            echo "Waiting ${wait_seconds} seconds until 08:00 Helsinki before publishing."
            sleep "$wait_seconds"
          fi

          if [ -f "$REPORT_ROOT/trading/${report_date}.md" ] \
            && [ -f "$REPORT_ROOT/long-term/${report_date}.md" ] \
            && [ -f "$REPORT_ROOT/global-ai/${report_date}.md" ]; then
            echo "RUN_DAILY_REPORT=false" >> "$GITHUB_ENV"
            echo "Skipping because all ${report_date} reports already exist."
          fi

      - name: Set up Python
        if: env.RUN_DAILY_REPORT == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install InvestmentAgent
        if: env.RUN_DAILY_REPORT == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Restore private fundamentals cache
        if: env.RUN_DAILY_REPORT == 'true'
        uses: actions/cache@v5
        with:
          path: .investmentagent/fundamentals-cache.json
          key: fundamentals-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fundamentals-${{ runner.os }}-

      - name: Skip closed Nordic market days
        if: github.event_name == 'schedule' && env.RUN_DAILY_REPORT == 'true'
        run: |
          report_date="$(TZ=Europe/Helsinki date +%F)"
          if ! investmentagent markets open \
            --date "$report_date" \
            --market stockholm \
            --market helsinki; then
            echo "RUN_DAILY_REPORT=false" >> "$GITHUB_ENV"
            echo "Skipping because Stockholm and Helsinki are not both open on ${report_date}."
          fi

      - name: Generate public watchlist report
        if: env.RUN_DAILY_REPORT == 'true'
        env:
          FINIMPULSE_API_KEY: ${{ secrets.FINIMPULSE_API_KEY }}
        run: |
          if [ -z "$FINIMPULSE_API_KEY" ]; then
            echo "::error::FINIMPULSE_API_KEY repository secret is missing."
            exit 1
          fi

          report_date="$(TZ=Europe/Helsinki date +%F)"
          generated_at="$(TZ=Europe/Helsinki date '+%Y-%m-%d %H:%M %Z')"

          generate_report() {
            report_name="$1"
            strategy="$2"
            report_dir="$REPORT_ROOT/$report_name"
            report_path="$report_dir/${report_date}.md"
            json_path="$RUNNER_TEMP/${report_name}-${report_date}.json"

            mkdir -p "$report_dir"
            investmentagent watchlist \
              --provider live \
              --fundamentals finimpulse \
              --country se,fi \
              --limit 10 \
              --refresh-limit 30 \
              --fundamentals-cache .investmentagent/fundamentals-cache.json \
              --cache-max-age-days 45 \
              --evaluation-dir "$EVALUATION_ROOT" \
              --evaluation-report-date "$report_date" \
              --min-country FI:3 \
              --strategy "$strategy" \
              --verbose \
              --save "$report_path" \
              --save "$json_path" \
              > "$RUNNER_TEMP/${report_name}-watchlist-output.txt"

            cp "$report_path" "$report_dir/latest.md"
          }

          generate_report "trading" "trading"
          generate_report "long-term" "long-term"

          mkdir -p "$REPORT_ROOT/global-ai"
          investmentagent global-ai top-5 \
            --limit 5 \
            --generated-at "$generated_at" \
            --save "$REPORT_ROOT/global-ai/${report_date}.md" \
            > "$RUNNER_TEMP/global-ai-output.txt"
          cp "$REPORT_ROOT/global-ai/${report_date}.md" "$REPORT_ROOT/global-ai/latest.md"

          mkdir -p docs/performance docs/data/performance
          investmentagent performance update \
            --report-json "$RUNNER_TEMP/trading-${report_date}.json" \
            --report-json "$RUNNER_TEMP/long-term-${report_date}.json" \
            --report-date "$report_date" \
            --ledger docs/data/performance/ledger.json \
            --output docs/performance/index.md \
            --latest docs/performance/latest.md \
            --price-provider live \
            --generated-at "$generated_at"

          {
            echo "# InvestmentAgent Daily Ideas"
            echo
            echo "Generated: ${generated_at}"
            echo
            echo "## Nordic Ideas"
            echo
            echo "- [Top 10 Trading Ideas](reports/trading/latest.html)"
            echo "- [Top 10 Long-Term Investment Ideas](reports/long-term/latest.html)"
            echo
            echo "## Global AI"
            echo
            echo "- [Global AI Overview](global-ai.html)"
            echo "- [Top 5 Global AI Candidates](reports/global-ai/latest.html)"
            echo
            echo "## Performance"
            echo
            echo "- [Performance Scorecard](performance/index.html)"
            echo
            echo "## Dated Reports"
            echo
            echo "- [Trading Ideas ${report_date}](reports/trading/${report_date}.html)"
            echo "- [Long-Term Investment Ideas ${report_date}](reports/long-term/${report_date}.html)"
            echo "- [Global AI Top 5 ${report_date}](reports/global-ai/${report_date}.html)"
            echo
            echo "Reports are research triage only. Not financial advice."
          } > docs/index.md

          {
            echo "# InvestmentAgent Global AI"
            echo
            echo "Generated: ${generated_at}"
            echo
            echo "## Latest Report"
            echo
            echo "- [Top 5 Global AI Candidates](reports/global-ai/latest.html)"
            echo
            echo "## Dated Reports"
            echo
            echo "- [Global AI Top 5 ${report_date}](reports/global-ai/${report_date}.html)"
            echo
            echo "Reports are research triage only. Not financial advice."
          } > docs/global-ai.md

      - name: Refresh Performance v2 outcomes and analysis
        if: env.RUN_DAILY_REPORT == 'true'
        continue-on-error: true
        timeout-minutes: 45
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: |
          retrieved_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          if [ -z "$EODHD_API_KEY" ]; then
            echo "::warning::Skipping Performance v2 outcome refresh because EODHD_API_KEY is missing."
          else
            investmentagent evaluate outcomes \
              --evaluation-root "$EVALUATION_ROOT" \
              --outcome-root "$OUTCOME_ROOT" \
              --price-provider eodhd \
              --retrieved-at "$retrieved_at"
          fi

          investmentagent evaluate analyze \
            --evaluation-root "$EVALUATION_ROOT" \
            --outcome-root "$OUTCOME_ROOT" \
            --output-json "$ANALYSIS_ROOT/performance-v2.json" \
            --output-markdown "$ANALYSIS_ROOT/performance-v2.md" \
            --generated-at "$retrieved_at"

      - name: Commit public report
        if: env.RUN_DAILY_REPORT == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.md docs/global-ai.md "$REPORT_ROOT" docs/performance docs/data/performance "$EVALUATION_ROOT"
          if [ -d "$OUTCOME_ROOT" ]; then
            git add "$OUTCOME_ROOT"
          fi
          if [ -d "$ANALYSIS_ROOT" ]; then
            git add "$ANALYSIS_ROOT"
          fi
          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi
          report_date="$(TZ=Europe/Helsinki date +%F)"
          git commit -m "reports: publish daily watchlist ${report_date}"
          git push origin HEAD:main
          git push origin HEAD:codex/investmentagent-live-data
